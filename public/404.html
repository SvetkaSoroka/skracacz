<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Link not found, Klik</title>
  <meta name="description" content="This short link does not exist or was deleted.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar">
    <div class="container bar__inner">
      <a class="logo" href="/" aria-label="Klik, home">Klik</a>
      <nav aria-label="Main">
        <a href="/">Shorten a link</a>
        <a href="/#api">API</a>
      </nav>
    </div>
  </header>

  <main id="main" class="stats-page">
    <div class="container">
      <div class="message">
        <h1>No link at this address</h1>
        <p>It was never created, or its owner deleted it. Check the link for a typo: codes are case-sensitive.</p>
        <div class="actions">
          <a class="btn" href="/">Shorten a new link</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="container foot__inner">
      <p>A student project for Nowatorski Projekt Indywidualny, 2026/27.</p>
      <p>Runs on Cloudflare Workers (Python) and D1.</p>
    </div>
  </footer>
</body>
</html>
